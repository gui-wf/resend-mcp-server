# Resend MCP Server - Descriptions Overlay
#
# This overlay provides LLM-optimized descriptions for tools.
# Descriptions follow the token optimization guidelines:
# - 80-150 characters optimal length (max 280)
# - Focus on what, not how
# - Mention key constraints
# - Avoid duplicating parameter info
#
# Tiers:
# - core: Always loaded, essential operations (4 tools)
# - secondary: CRUD operations, loaded on demand
# - tertiary: Advanced/destructive operations, admin scope
#
# Usage: Applied during merge:spec to produce openapi/merged.yaml

overlay: 1.0.0
info:
  title: Resend MCP Descriptions Overlay
  version: 1.0.0

actions:
  # =============================================================================
  # Email Operations
  # =============================================================================
  # Core: send_email, list_emails, get_email
  - target: "$.paths['/emails'].post"
    update:
      x-speakeasy-mcp:
        tool-name: send_email
        tier: core
        description: "Send an email via Resend API. Requires verified sender domain. Supports HTML, text, and attachments."

  - target: "$.paths['/emails'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_emails
        tier: core
        description: "List sent emails with pagination. Returns delivery status, timestamps, and recipient info."

  - target: "$.paths['/emails/{email_id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_email
        tier: core
        description: "Get details of a single email by ID including delivery status, timestamps, and content."

  - target: "$.paths['/emails/{email_id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_email
        tier: secondary
        description: "Update a scheduled email before it is sent. Cannot modify already-sent emails."

  - target: "$.paths['/emails/{email_id}/cancel'].post"
    update:
      x-speakeasy-mcp:
        tool-name: cancel_email
        tier: secondary
        description: "Cancel a scheduled email. Only works before the scheduled send time."

  - target: "$.paths['/emails/batch'].post"
    update:
      x-speakeasy-mcp:
        tool-name: send_batch_emails
        tier: tertiary
        description: "Send up to 100 emails in one request. Use for bulk transactional emails with unique recipients."

  - target: "$.paths['/emails/{email_id}/attachments'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_email_attachments
        tier: tertiary
        description: "List attachments for a sent email. Returns file metadata and download URLs."

  - target: "$.paths['/emails/{email_id}/attachments/{attachment_id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_email_attachment
        tier: tertiary
        description: "Get a single attachment from a sent email by attachment ID."

  # =============================================================================
  # Receiving Emails Operations
  # =============================================================================
  - target: "$.paths['/emails/receiving'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_received_emails
        tier: tertiary
        description: "List inbound emails received by configured domains. Requires inbound email enabled."

  - target: "$.paths['/emails/receiving/{email_id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_received_email
        tier: tertiary
        description: "Get details of a single received email including sender, subject, and body content."

  - target: "$.paths['/emails/receiving/{email_id}/attachments'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_received_email_attachments
        tier: tertiary
        description: "List attachments for a received inbound email."

  - target: "$.paths['/emails/receiving/{email_id}/attachments/{attachment_id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_received_email_attachment
        tier: tertiary
        description: "Get a single attachment from a received inbound email."

  # =============================================================================
  # Domain Operations
  # =============================================================================
  # Core: list_domains
  - target: "$.paths['/domains'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_domains
        tier: core
        description: "List all domains with verification status. Use to find verified domains for sending."

  - target: "$.paths['/domains'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_domain
        tier: secondary
        description: "Add a new domain to Resend. Returns DNS records required for verification."

  - target: "$.paths['/domains/{domain_id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_domain
        tier: secondary
        description: "Get domain details including DNS records, verification status, and settings."

  - target: "$.paths['/domains/{domain_id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_domain
        tier: secondary
        description: "Update domain settings like click tracking, open tracking, or TLS settings."

  - target: "$.paths['/domains/{domain_id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_domain
        tier: tertiary
        description: "Permanently delete a domain. This action cannot be undone. Emails cannot be sent after."

  - target: "$.paths['/domains/{domain_id}/verify'].post"
    update:
      x-speakeasy-mcp:
        tool-name: verify_domain
        tier: secondary
        description: "Trigger DNS verification check for a domain. Verify DNS records are configured first."

  # =============================================================================
  # API Key Operations (EXCLUDED - kept for completeness)
  # =============================================================================
  - target: "$.paths['/api-keys'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_api_keys
        tier: excluded
        description: "List API keys. EXCLUDED for security reasons."

  - target: "$.paths['/api-keys'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_api_key
        tier: excluded
        description: "Create an API key. EXCLUDED for security reasons."

  - target: "$.paths['/api-keys/{api_key_id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_api_key
        tier: excluded
        description: "Delete an API key. EXCLUDED for security reasons."

  # =============================================================================
  # Template Operations
  # =============================================================================
  - target: "$.paths['/templates'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_templates
        tier: secondary
        description: "List all email templates. Only published templates can be used for sending."

  - target: "$.paths['/templates'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_template
        tier: secondary
        description: "Create a new email template with HTML content and optional variables."

  - target: "$.paths['/templates/{id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_template
        tier: secondary
        description: "Get template details including HTML content, variables, and publish status."

  - target: "$.paths['/templates/{id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_template
        tier: secondary
        description: "Update template content or name. Republish required to use changes."

  - target: "$.paths['/templates/{id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_template
        tier: tertiary
        description: "Permanently delete a template. This action cannot be undone."

  - target: "$.paths['/templates/{id}/publish'].post"
    update:
      x-speakeasy-mcp:
        tool-name: publish_template
        tier: secondary
        description: "Publish a template to make it available for sending emails."

  - target: "$.paths['/templates/{id}/duplicate'].post"
    update:
      x-speakeasy-mcp:
        tool-name: duplicate_template
        tier: secondary
        description: "Create a copy of an existing template with a new name."

  # =============================================================================
  # Audience Operations
  # =============================================================================
  - target: "$.paths['/audiences'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_audiences
        tier: secondary
        description: "List all audiences (contact lists) for broadcasts and campaigns."

  - target: "$.paths['/audiences'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_audience
        tier: secondary
        description: "Create a new audience to organize contacts for broadcasts."

  - target: "$.paths['/audiences/{id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_audience
        tier: secondary
        description: "Get audience details including name and contact count."

  - target: "$.paths['/audiences/{id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_audience
        tier: tertiary
        description: "Permanently delete an audience and all its contacts. Cannot be undone."

  # =============================================================================
  # Contact Operations
  # =============================================================================
  - target: "$.paths['/audiences/{audience_id}/contacts'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_contacts
        tier: secondary
        description: "List all contacts in an audience with pagination."

  - target: "$.paths['/audiences/{audience_id}/contacts'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_contact
        tier: secondary
        description: "Add a contact to an audience for broadcasts and campaigns."

  - target: "$.paths['/audiences/{audience_id}/contacts/{email}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_contact_by_email
        tier: secondary
        description: "Get a contact by email address including custom properties."

  - target: "$.paths['/audiences/{audience_id}/contacts/{email}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_contact_by_email
        tier: secondary
        description: "Update contact details by email address."

  - target: "$.paths['/audiences/{audience_id}/contacts/{email}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_contact_by_email
        tier: tertiary
        description: "Permanently delete a contact by email address. Cannot be undone."

  - target: "$.paths['/audiences/{audience_id}/contacts/{id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_contact
        tier: secondary
        description: "Get a contact by ID including custom properties and metadata."

  - target: "$.paths['/audiences/{audience_id}/contacts/{id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_contact
        tier: secondary
        description: "Update contact details like name or custom properties."

  - target: "$.paths['/audiences/{audience_id}/contacts/{id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_contact
        tier: tertiary
        description: "Permanently delete a contact by ID. Cannot be undone."

  # =============================================================================
  # Contact Segments Operations
  # =============================================================================
  - target: "$.paths['/audiences/{audience_id}/contacts/{id}/segments'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_contact_segments
        tier: tertiary
        description: "List all segments a contact belongs to."

  - target: "$.paths['/audiences/{audience_id}/contacts/{id}/segments'].post"
    update:
      x-speakeasy-mcp:
        tool-name: add_contact_to_segment
        tier: tertiary
        description: "Add a contact to a segment for targeted broadcasts."

  - target: "$.paths['/audiences/{audience_id}/contacts/{id}/segments/{segment_id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: remove_contact_from_segment
        tier: tertiary
        description: "Remove a contact from a segment. Contact is not deleted."

  # =============================================================================
  # Contact Topics Operations
  # =============================================================================
  - target: "$.paths['/audiences/{audience_id}/contacts/{id}/topics'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_contact_topics
        tier: tertiary
        description: "Get topic subscriptions for a contact."

  - target: "$.paths['/audiences/{audience_id}/contacts/{id}/topics'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_contact_topics
        tier: tertiary
        description: "Update topic subscriptions for a contact."

  # =============================================================================
  # Broadcast Operations
  # =============================================================================
  - target: "$.paths['/broadcasts'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_broadcasts
        tier: tertiary
        description: "List all broadcasts (marketing campaigns) with status and stats."

  - target: "$.paths['/broadcasts'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_broadcast
        tier: tertiary
        description: "Create a broadcast to send to an audience. Must be sent separately."

  - target: "$.paths['/broadcasts/{id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_broadcast
        tier: tertiary
        description: "Get broadcast details including delivery statistics and status."

  - target: "$.paths['/broadcasts/{id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_broadcast
        tier: tertiary
        description: "Update broadcast content before sending. Cannot modify sent broadcasts."

  - target: "$.paths['/broadcasts/{id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_broadcast
        tier: tertiary
        description: "Delete a draft broadcast. Cannot delete sent broadcasts."

  - target: "$.paths['/broadcasts/{id}/send'].post"
    update:
      x-speakeasy-mcp:
        tool-name: send_broadcast
        tier: tertiary
        description: "Send a broadcast to its target audience. This action is irreversible."

  # =============================================================================
  # Webhook Operations
  # =============================================================================
  - target: "$.paths['/webhooks'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_webhooks
        tier: secondary
        description: "List all configured webhooks for email event notifications."

  - target: "$.paths['/webhooks'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_webhook
        tier: secondary
        description: "Create a webhook to receive email event notifications (delivered, bounced, etc)."

  - target: "$.paths['/webhooks/{webhook_id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_webhook
        tier: tertiary
        description: "Get webhook configuration including URL and subscribed events."

  - target: "$.paths['/webhooks/{webhook_id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_webhook
        tier: secondary
        description: "Update webhook URL or event subscriptions."

  - target: "$.paths['/webhooks/{webhook_id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_webhook
        tier: tertiary
        description: "Delete a webhook. No more events will be sent to this endpoint."

  # =============================================================================
  # Segment Operations
  # =============================================================================
  - target: "$.paths['/segments'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_segments
        tier: tertiary
        description: "List all contact segments for targeted broadcasts."

  - target: "$.paths['/segments'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_segment
        tier: tertiary
        description: "Create a segment to group contacts for targeted broadcasts."

  - target: "$.paths['/segments/{id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_segment
        tier: tertiary
        description: "Get segment details by ID including contact count."

  - target: "$.paths['/segments/{id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_segment
        tier: tertiary
        description: "Delete a segment. Contacts in the segment are not affected."

  # =============================================================================
  # Topic Operations
  # =============================================================================
  - target: "$.paths['/topics'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_topics
        tier: secondary
        description: "List all email topics for subscription management."

  - target: "$.paths['/topics'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_topic
        tier: secondary
        description: "Create a topic to segment audience subscriptions by interest."

  - target: "$.paths['/topics/{id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_topic
        tier: tertiary
        description: "Get topic details by ID."

  - target: "$.paths['/topics/{id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_topic
        tier: tertiary
        description: "Update topic name or default subscription setting."

  - target: "$.paths['/topics/{id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_topic
        tier: tertiary
        description: "Permanently delete a topic. Cannot be undone."

  # =============================================================================
  # Contact Property Operations
  # =============================================================================
  - target: "$.paths['/contact-properties'].get"
    update:
      x-speakeasy-mcp:
        tool-name: list_contact_properties
        tier: tertiary
        description: "List all custom contact properties (fields) defined for contacts."

  - target: "$.paths['/contact-properties'].post"
    update:
      x-speakeasy-mcp:
        tool-name: create_contact_property
        tier: tertiary
        description: "Create a custom property field for contacts."

  - target: "$.paths['/contact-properties/{id}'].get"
    update:
      x-speakeasy-mcp:
        tool-name: get_contact_property
        tier: tertiary
        description: "Get contact property details by ID."

  - target: "$.paths['/contact-properties/{id}'].patch"
    update:
      x-speakeasy-mcp:
        tool-name: update_contact_property
        tier: tertiary
        description: "Update a custom contact property name or settings."

  - target: "$.paths['/contact-properties/{id}'].delete"
    update:
      x-speakeasy-mcp:
        tool-name: delete_contact_property
        tier: tertiary
        description: "Delete a custom contact property. Property values on contacts are removed."
