# Resend MCP Server - Exclusions Overlay
#
# This overlay disables endpoints that should not be exposed via MCP
# due to security concerns or lack of utility.
#
# Exclusion reasons:
# - security: Operations that could expose or modify credentials
# - internal: Operations meant for internal use only
# - deprecated: Operations that are being phased out
#
# Usage: Applied during merge:spec to produce openapi/merged.yaml

overlay: 1.0.0
info:
  title: Resend MCP Exclusions Overlay
  version: 1.0.0

actions:
  # =============================================================================
  # API Key Operations - SECURITY RISK
  # =============================================================================
  # These endpoints are disabled because:
  # 1. API key listing could expose credential information
  # 2. API key creation could enable privilege escalation attacks
  # 3. API key deletion could disrupt production systems and cause service outages

  # GET /api-keys - List API keys
  - target: "$.paths['/api-keys'].get"
    update:
      x-speakeasy-mcp:
        disabled: true
        disabled-reason: "Security risk - API key listing could expose credentials to unauthorized users"

  # POST /api-keys - Create API key
  - target: "$.paths['/api-keys'].post"
    update:
      x-speakeasy-mcp:
        disabled: true
        disabled-reason: "Security risk - API key creation could enable privilege escalation or unauthorized access"

  # DELETE /api-keys/{api_key_id} - Delete API key
  - target: "$.paths['/api-keys/{api_key_id}'].delete"
    update:
      x-speakeasy-mcp:
        disabled: true
        disabled-reason: "Security risk - API key deletion could disrupt production systems and cause service outages"

  # =============================================================================
  # Future Exclusions
  # =============================================================================
  # Add additional exclusions here as needed. Use the following format:
  #
  # - target: "$.paths['/endpoint'].method"
  #   update:
  #     x-speakeasy-mcp:
  #       disabled: true
  #       disabled-reason: "Reason for exclusion"
  #
  # Valid reasons include:
  # - "Security risk - [description]"
  # - "Internal use only - [description]"
  # - "Deprecated - [description]"
  # - "Not suitable for AI automation - [description]"
