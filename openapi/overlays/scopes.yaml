# Resend MCP Server - Scopes Overlay
#
# This overlay assigns scope tags (read, write, admin) to each endpoint
# for use with the --scope CLI flag.
#
# Scope definitions:
# - read: GET operations that do not modify state
# - write: POST, PUT, PATCH operations that create or modify resources
# - admin: DELETE operations and other destructive/sensitive actions
#
# Usage: Applied during merge:spec to produce openapi/merged.yaml
#
# AIDEV-TODO: Complete overlay implementation in Phase 2

overlay: 1.0.0
info:
  title: Resend MCP Scopes Overlay
  version: 1.0.0

actions:
  # Email Operations
  - target: "$.paths['/emails'].post"
    update:
      x-speakeasy-mcp:
        scopes:
          - write

  - target: "$.paths['/emails'].get"
    update:
      x-speakeasy-mcp:
        scopes:
          - read

  - target: "$.paths['/emails/{email_id}'].get"
    update:
      x-speakeasy-mcp:
        scopes:
          - read

  - target: "$.paths['/emails/{email_id}'].patch"
