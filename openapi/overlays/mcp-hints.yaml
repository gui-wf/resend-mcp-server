# Resend MCP Server - MCP Hints Overlay
#
# This overlay adds MCP-specific annotations to help AI assistants
# understand tool behavior and safety characteristics.
#
# Annotations:
# - readOnlyHint: true for operations that don't modify state
# - destructiveHint: true for operations that delete/replace data
# - idempotentHint: true for operations safe to retry
# - openWorldHint: false for closed API system (Resend API only)
#
# Usage: Applied during merge:spec to produce openapi/merged.yaml
#
# AIDEV-TODO: Complete overlay implementation in Phase 2

overlay: 1.0.0
info:
  title: Resend MCP Hints Overlay
  version: 1.0.0

actions:
  # Read Operations - readOnlyHint: true, destructiveHint: false
  - target: "$.paths['/emails'].get"
    update:
      x-speakeasy-mcp:
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false

