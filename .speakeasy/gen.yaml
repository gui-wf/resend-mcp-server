# Speakeasy Generation Configuration
#
# This file configures how Speakeasy generates the MCP server from OpenAPI.
# See: https://www.speakeasy.com/docs/customize/generation-config
#
# AIDEV-TODO: Complete configuration in Phase 2 after validating spec

configVersion: 2.0.0
generation:
  sdkClassName: ResendMCP
  usageSnippets:
    optionalPropertyRendering: withExample
  fixes:
    nameResolutionDec2023: true
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
  auth:
    oAuth2ClientCredentialsEnabled: false
typescript:
  version: 0.1.0
  additionalDependencies: {}
  additionalDevDependencies: {}
  author: gui-wf
  clientServerStatusCodesAsErrors: true
  enumFormat: union
  flattenGlobalSecurity: true
  imports:
    option: openapi
    paths:
      callbacks: models/callbacks
      errors: models/errors
      operations: models/operations
      shared: models/components
      webhooks: models/webhooks
  inputModelSuffix: input
  maxMethodParams: 4
  methodArguments: require-security-and-request
  moduleFormat: esm
  outputModelSuffix: output
  packageName: resend-mcp-server
  responseFormat: flat
  templateVersion: v2
