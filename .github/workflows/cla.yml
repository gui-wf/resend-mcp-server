name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Required permissions for the CLA action
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/${{ github.repository }}/blob/master/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "master"
          allowlist: "dependabot[bot],github-actions[bot],renovate[bot],bot*"

          # Custom signature comment
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"

          # Message shown to contributors who haven't signed
          custom-notsigned-prcomment: |
            ## Contributor License Agreement

            Thank you for your contribution! Before we can merge this pull request, you need to sign our [Contributor License Agreement (CLA)](https://github.com/${{ github.repository }}/blob/master/CLA.md).

            ### Why a CLA?

            This project is dual-licensed:
            - **Open Source**: Always available under AGPL-3.0
            - **Commercial**: Available to organizations that need a proprietary license

            The CLA grants the project maintainer the right to offer both licensing options. **You retain full copyright ownership of your contributions** and can use your code however you wish.

            ### How to Sign

            Please read the [CLA document](https://github.com/${{ github.repository }}/blob/master/CLA.md), then reply to this PR with the following comment:

            ```
            I have read the CLA Document and I hereby sign the CLA
            ```

            This is a one-time process that applies to all your future contributions to this project.

          # Message shown when all contributors have signed
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you for your contribution!
